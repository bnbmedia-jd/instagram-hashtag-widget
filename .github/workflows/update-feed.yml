name: Update hashtag feed

on:
  schedule:
    # Every 5 minutes, the GitHub Actions minimum. Scheduled runs are still
    # delayed under load, so use scripts/refresh.sh when a post needs to appear
    # immediately.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Never let two runs push to data/ at once.
concurrency:
  group: update-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No install step: the fetch uses only Node built-ins, and the env vars
      # below stand in for dotenv. Installing dependencies here cost over four
      # minutes per run for no benefit.

      - name: Fetch hashtag feed
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          HASHTAG: ${{ vars.HASHTAG || 'befestival2026' }}
          IG_ACCOUNTS: ${{ vars.IG_ACCOUNTS }}
          IG_SINCE: ${{ vars.IG_SINCE }}
          IG_INCLUDE_SELF: ${{ vars.IG_INCLUDE_SELF }}
        run: npm run fetch

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/hashtag-id.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update feed [skip ci]"
            # Rebase in case a concurrent run already pushed.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp -r public/* site/
          cp data/feed.json site/data/feed.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
